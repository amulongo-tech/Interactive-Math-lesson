<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voting Systems Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: black header strip + red rule (matches the class slide decks); one centered column of dotted, sharp-cornered section boxes for students; a wide tabbed console for the teacher. */
:root{
  --paper:#ffffff; --ink:#000000; --muted:#4b4b4b; --line:#000000; --soft:#f3f3f1; --strip:#000000; --strip-ink:#ffffff;
  --red:#c8102e; --ok:#17703a; --okbg:#e5f3ea; --bad:#b3261e; --badbg:#fbe8e6; --warn:#7a5200; --warnbg:#fff2d3; --focus:#1749c9; --bar:#1f1f1f; --barbg:#e4e4e1;
  --display:"Oswald","Arial Narrow",Arial,sans-serif;
  --body:"Trebuchet MS","Source Sans 3","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141414; --ink:#f4f4f2; --muted:#b8b8b4; --line:#cfcfcb; --soft:#1f1f1e; --strip:#000000; --strip-ink:#ffffff;
  --red:#ff4d5e; --ok:#6fd49a; --okbg:#143222; --bad:#ff8a80; --badbg:#3a1714; --warn:#ffcf6b; --warnbg:#3a2c0b; --focus:#8fb0ff; --bar:#e8e8e4; --barbg:#333331; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141414; --ink:#f4f4f2; --muted:#b8b8b4; --line:#cfcfcb; --soft:#1f1f1e; --strip:#000000; --strip-ink:#ffffff;
  --red:#ff4d5e; --ok:#6fd49a; --okbg:#143222; --bad:#ff8a80; --badbg:#3a1714; --warn:#ffcf6b; --warnbg:#3a2c0b; --focus:#8fb0ff; --bar:#e8e8e4; --barbg:#333331; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--strip)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.15}
.tabnum{font-variant-numeric:tabular-nums}

/* header */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--strip);color:var(--strip-ink);border-bottom:5px solid var(--red)}
.strip-in{max-width:1280px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.strip h1{font-size:1.45rem;color:var(--strip-ink);text-transform:uppercase}
.strip .sub{font-size:.85rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.strip .grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--strip-ink);padding:3px 10px;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.clockbtn{background:transparent;color:var(--strip-ink);cursor:pointer}
.clockbtn.low{background:var(--red);border-color:var(--red)}
.clockbtn.done{opacity:.8}
.langbtn{background:transparent;color:var(--strip-ink);cursor:pointer;font-family:var(--body);font-weight:600}
.langbtn:hover{background:var(--red);border-color:var(--red)}
.chip.timer{font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.chip.timer.low{background:var(--red);border-color:var(--red)}

.wrap{max-width:880px;margin:0 auto;padding-block:22px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.wrap.wide{max-width:1280px}

/* lesson framework */
.frame{border:2px solid var(--line);display:grid;grid-template-columns:1fr 1fr;}
.frame>div{padding:12px 14px;min-width:0}
.frame>div+div{border-left:2px solid var(--line)}
.frame .lab{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;color:var(--red);font-weight:600}
.frame ul{margin:4px 0 0;padding-left:20px}
@media (max-width:640px){.frame{grid-template-columns:1fr}.frame>div+div{border-left:0;border-top:2px solid var(--line)}}

/* sections */
.sec{border:2.5px dotted var(--line);padding:18px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:90px;position:relative}
.sec.now{border-style:solid;border-color:var(--red)}
.sec-h{display:flex;gap:12px;align-items:flex-start}
.sqnum{flex:none;width:44px;height:44px;border:2.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;font-weight:700}
.sec.now .sqnum{background:var(--red);border-color:var(--red);color:#fff}
.sec-h .t{flex:1;min-width:0}
.sec-h h2{font-size:1.5rem;text-transform:uppercase}
.meta{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nowtag{display:inline-block;background:var(--red);color:#fff;font-size:.72rem;letter-spacing:.1em;padding:1px 7px;margin-left:8px;vertical-align:middle}
.locked{display:flex;align-items:center;gap:12px;padding:14px;background:var(--soft);color:var(--muted)}
.locked svg{flex:none}
p{margin:0}
.lead{max-width:65ch}

/* preference schedule */
.sched-wrap{overflow-x:auto}
table.sched{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:320px}
table.sched th,table.sched td{border:1.5px solid var(--line);padding:6px 12px;text-align:center}
table.sched th{font-family:var(--display);font-weight:500;text-transform:uppercase;font-size:.82rem;letter-spacing:.05em;background:var(--soft)}
table.sched td.voters{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.92rem}
.legend b{display:inline-grid;place-items:center;width:22px;height:22px;border:1.5px solid var(--line);margin-right:5px;font-size:.85rem}
.scenario{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--soft)}
.scenario h3{font-size:1.1rem;text-transform:uppercase}
.dz-text{font-weight:600;line-height:2.3;max-width:72ch}
.slot{display:inline-flex;align-items:center;min-width:150px;min-height:40px;padding:4px 12px;margin:2px 4px;border:2px dashed var(--line);background:var(--paper);vertical-align:middle;cursor:pointer;font-weight:600;text-align:left}
.slot.empty{color:var(--muted);font-weight:400}
.slot.over{background:var(--warnbg)}
.slot.right{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.slot.wrong{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.slot:disabled{cursor:default}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1.5px solid var(--line);background:var(--soft);margin-top:8px}
.chip2{border:2px solid var(--line);background:var(--paper);padding:7px 12px;cursor:grab;font-weight:600;text-align:left;max-width:100%}
.chip2.sel{background:var(--ink);color:var(--paper)}
.mrow{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
.stmt{line-height:2.2;padding:10px 14px;border:1.5px solid var(--line);font-size:1.05rem}
.seg{border:0;border-bottom:3px solid var(--line);background:var(--soft);padding:2px 6px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.seg.sel{background:var(--warnbg);border-bottom-color:var(--warn)}
.seg.right{background:var(--okbg);border-bottom-color:var(--ok)}
.seg.wrong{background:var(--badbg);border-bottom-color:var(--bad)}
.seg:disabled{cursor:default}
.talk{border:2px dashed var(--line);padding:10px 14px;background:var(--soft)}
.why{font-size:.92rem;padding:7px 10px;border-left:4px solid var(--line);background:var(--soft);margin-top:6px}

/* items */
.item{display:flex;gap:12px;align-items:flex-start}
.qn{flex:none;min-width:44px;height:30px;padding:0 6px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:.95rem}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.item .prompt{font-weight:600;max-width:68ch}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--line);padding:0 6px;margin-left:6px;vertical-align:2px;font-weight:600}
.tag.red{border-color:var(--red);color:var(--red)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--paper);border:1.5px solid var(--line);padding:8px 12px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){background:var(--soft)}
.opt .box{flex:none;width:18px;height:18px;border:2px solid var(--line);margin-top:3px}
.opt.sel .box{background:var(--ink);box-shadow:inset 0 0 0 3px var(--paper)}
.opt.sel{border-width:2.5px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fields{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;font-size:.85rem}
.field span{font-weight:600}
input.num{width:96px;padding:7px 9px;border:2px solid var(--line);background:var(--paper);font-variant-numeric:tabular-nums;font-size:1.05rem}
input.num.right{border-color:var(--ok);background:var(--okbg)}
input.num.wrong{border-color:var(--bad);background:var(--badbg)}
textarea,input.txt,select{width:100%;padding:9px 10px;border:2px solid var(--line);background:var(--paper)}
textarea{min-height:96px;resize:vertical}
.btn{border:2px solid var(--line);background:var(--ink);color:var(--paper);padding:7px 16px;font-family:var(--display);font-weight:500;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-size:.95rem}
.btn:hover:not(:disabled){background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover:not(:disabled){color:#fff}
.btn.on{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:3px 10px;font-size:.8rem}
.fb{font-size:.92rem;padding:7px 10px;border-left:4px solid var(--line)}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.no{border-color:var(--bad);background:var(--badbg)}
.fb.wait{border-color:var(--warn);background:var(--warnbg)}
.hint{font-size:.9rem;color:var(--muted)}
.linkish{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:.88rem}
.rubric{font-size:.88rem;border:1.5px solid var(--line);border-collapse:collapse;width:100%}
.rubric td{border:1.5px solid var(--line);padding:4px 8px;vertical-align:top}
.rubric td:first-child{width:52px;text-align:center;font-weight:700}
.tscore{font-size:.88rem;font-weight:600}
.divider{border-top:2px solid var(--line);padding-top:12px;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:.95rem}

/* method reveal cards */
.methods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.methods{grid-template-columns:1fr}}
.mcard{border:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mcard h3{font-size:1.05rem;text-transform:uppercase}
.mcard .win{font-family:var(--display);font-size:1.3rem;color:var(--red)}
.mcard.hide{border-style:dashed;color:var(--muted)}
.mcard .work{font-size:.9rem;font-variant-numeric:tabular-nums}
.mini{border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.mini td,.mini th{border:1px solid var(--line);padding:2px 8px;text-align:center}
.mini th{font-weight:600}

/* join */
.join{border:2.5px dotted var(--line);padding:22px;display:flex;flex-direction:column;gap:14px;max-width:520px}
.join h2{font-size:1.6rem;text-transform:uppercase}
.notice{padding:10px 12px;border:2px solid var(--warn);background:var(--warnbg);font-size:.92rem}

/* pause overlay */
.pause{position:fixed;inset:0;z-index:20;background:var(--strip);color:var(--strip-ink);display:grid;place-items:center;text-align:center;padding:24px}
.pause h2{font-size:clamp(2.2rem,8vw,4.5rem);text-transform:uppercase;color:#fff}
.pause p{opacity:.85;margin-top:8px}
.pause .redline{width:120px;height:6px;background:var(--red);margin:14px auto}

/* submit code */
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all;padding:10px;border:1.5px dashed var(--line);background:var(--soft);user-select:all}

/* teacher console */
.tabs{display:flex;gap:0;border-bottom:3px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 16px;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:1rem;cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-3px}
.tabs button[aria-selected="true"]{border-bottom-color:var(--red);color:var(--red)}
.console{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.console{grid-template-columns:1fr}}
.panel{border:2px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:1.05rem;text-transform:uppercase}
.secrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line)}
.secrow .n{font-family:var(--display);font-weight:700;font-size:1.1rem}
.secrow .nm{font-size:.92rem;line-height:1.2}
.secrow .nm small{display:block;color:var(--muted);font-size:.75rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:2px solid var(--line);padding:8px 10px}
.stat .v{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ia{display:flex;flex-direction:column;gap:10px}
.iarow{display:grid;grid-template-columns:52px minmax(0,1fr) 120px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line)}
.iarow .p{font-size:.88rem;line-height:1.3}
.bar{height:16px;background:var(--barbg);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--bar)}
.bar.first i{background:var(--ok)}
.pct{font-size:.85rem;font-variant-numeric:tabular-nums}
.pct.low{color:var(--bad);font-weight:700}
.dist{display:flex;flex-direction:column;gap:3px;font-size:.8rem;margin-top:4px}
.dist .d{display:grid;grid-template-columns:minmax(0,1fr) 90px 28px;gap:6px;align-items:center}
.dist .d.k{font-weight:700}
.tbl-wrap{overflow-x:auto;border:2px solid var(--line)}
table.gb{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
table.gb th,table.gb td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;white-space:nowrap}
table.gb th{font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:.8rem;background:var(--soft);position:sticky;top:0}
table.gb td.c{text-align:center}
table.gb tr.click{cursor:pointer}
table.gb tr.click:hover td{background:var(--soft)}
.pill{display:inline-block;padding:0 7px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1.5px solid currentColor}
.pill.met{color:var(--ok)} .pill.near{color:var(--warn)} .pill.need{color:var(--bad)}
.mark{font-weight:700} .mark.ok{color:var(--ok)} .mark.fix{color:var(--warn)} .mark.no{color:var(--bad)}
.grade{display:flex;flex-direction:column;gap:10px}
.resp{border:1.5px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
.resp .who{font-weight:700}
.resp .txt{white-space:pre-wrap;max-width:75ch}
.scorebtns{display:flex;gap:4px;flex-wrap:wrap}
.drawer{border:2.5px solid var(--red);padding:14px;display:flex;flex-direction:column;gap:10px}
.empty{padding:22px;text-align:center;color:var(--muted);border:2px dashed var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;z-index:30;font-size:.9rem}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;border:2px solid var(--bad);background:var(--badbg);font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.sec{transition:border-color .2s}}
body.secure #app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.secure #app input,body.secure #app textarea,body.secure #app .code{-webkit-user-select:text;user-select:text}
@media print{body.secure #app{display:none!important}body.secure::after{content:"Printing is turned off during this lesson.";display:block;padding:40px;font-size:20px}}
#secWarn{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#secWarn .box{background:var(--paper);color:var(--ink);border:3px solid var(--red);max-width:520px;width:100%;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
#secWarn h2{color:var(--red);text-transform:uppercase;font-size:1.25rem}
#calcBtn{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;align-items:center;gap:8px;padding:11px 16px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#calcBtn[aria-expanded="true"]{background:var(--red);border-color:var(--red)}
#calcBtn svg{width:20px;height:20px}
#calcPanel{position:fixed;right:18px;bottom:76px;z-index:45;width:min(400px,calc(100vw - 32px));height:min(540px,calc(100vh - 110px));background:var(--paper);border:3px solid var(--ink);display:flex;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.28)}
#calcPanel .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--ink);color:var(--paper);cursor:move;user-select:none;touch-action:none}
#calcPanel .bar b{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
#calcPanel .bar button{background:transparent;border:1.5px solid var(--paper);color:var(--paper);width:30px;height:30px;font-size:1rem;line-height:1;cursor:pointer}
#calcPanel .host{flex:1;min-height:0;position:relative}
#calcPanel .msg{padding:16px;color:var(--muted)}
@media (max-width:560px){#calcPanel{left:16px;right:16px;width:auto;bottom:72px;height:min(480px,calc(100vh - 100px))}}
@media print{#calcBtn,#calcPanel{display:none!important}}
</style>
</head>
<body>


<header class="strip"><div class="strip-in">
  <div class="grow">
    <div class="sub" id="hdrSub">Discrete Mathematics · DM.DPSR.1.1 · Review · 51 min</div>
    <h1 id="hdrTitle">Voting Systems Review</h1>
  </div>
  <button class="chip langbtn" id="hdrLang" type="button" hidden></button>
  <span class="chip" id="hdrWho" hidden></span>
  <span class="chip timer" id="hdrTimer" hidden></span>
  <button class="chip timer clockbtn" id="hdrClock" type="button" hidden></button>
</div></header>

<main id="app" class="wrap"></main>
<div id="pause" class="pause" hidden><div><h2 id="pauseH">Eyes up front</h2><div class="redline"></div><p id="pauseP">Hands off the keyboard. Your work is saved.</p></div></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ============================== DATA ============================== */
const E = {"t1": {"title": "Table 1: Homecoming Themes", "story": "33 students ranked three homecoming themes. Use Table 1 for Questions 13–18 and 22–24.", "hideTotal": true, "cands": {"A": "Arcade Night", "B": "Beach Party", "C": "Carnival"}, "groups": [[12, "ABC"], [10, "BCA"], [7, "CBA"], [4, "CAB"]]}, "t1r": {"title": "Table 1 (repeated)", "story": "", "hideTotal": true, "cands": {"A": "Arcade Night", "B": "Beach Party", "C": "Carnival"}, "groups": [[12, "ABC"], [10, "BCA"], [7, "CBA"], [4, "CAB"]]}, "t3": {"title": "Table 3: End-of-Year Events", "story": "40 club members ranked four end-of-year events. Use Table 3 for Questions 31, 32 and 35.", "hideTotal": true, "cands": {"P": "Pizza Party", "Q": "Quiz Bowl", "R": "Rock Climbing", "S": "Scavenger Hunt"}, "groups": [[15, "PQRS"], [11, "QSRP"], [9, "RQSP"], [5, "SRQP"]]}, "t3r": {"title": "Table 3 (repeated)", "story": "", "hideTotal": true, "cands": {"P": "Pizza Party", "Q": "Quiz Bowl", "R": "Rock Climbing", "S": "Scavenger Hunt"}, "groups": [[15, "PQRS"], [11, "QSRP"], [9, "RQSP"], [5, "SRQP"]]}};
const ORD=["1st","2nd","3rd","4th","5th"];
const tot=e=>e.groups.reduce((s,g)=>s+g[0],0);
const firsts=(e,act)=>{const o={};act.forEach(x=>o[x]=0);e.groups.forEach(([n,r])=>{o[[...r].find(x=>act.includes(x))]+=n});return o};
const bordaOf=e=>{const c=Object.keys(e.cands),o={};c.forEach(x=>o[x]=0);e.groups.forEach(([n,r])=>[...r].forEach((x,i)=>o[x]+=n*(c.length-i)));return o};
const irvOf=e=>{let a=Object.keys(e.cands);const T=tot(e),rounds=[],out=[];for(;;){const f=firsts(e,a);rounds.push(f);const best=a.reduce((p,q)=>f[p]>=f[q]?p:q);if(f[best]>T/2)return{rounds,out,winner:best};const w=a.reduce((p,q)=>f[p]<=f[q]?p:q);out.push(w);a=a.filter(x=>x!==w)}};
const runoffOf=e=>{const c=Object.keys(e.cands),f=firsts(e,c);const top=[...c].sort((p,q)=>f[q]-f[p]).slice(0,2);const h=firsts(e,top);return{top,h,winner:h[top[0]]>=h[top[1]]?top[0]:top[1]}};
const plurOf=e=>{const f=firsts(e,Object.keys(e.cands));return{f,winner:Object.keys(f).reduce((p,q)=>f[p]>=f[q]?p:q)}};

ror in Kim’s statement, then drag in the fix.", "parts": [[0, "In Table 1, "], [1, "Carnival"], [0, " has "], [1, "7"], [0, " first-place votes because the Carnival column says 7."]], "chips": ["11 (7 + 4)", "17", "4", "Beach Party"], "key": "1.0", "why": "Add every column where the candidate is ranked 1st: Carnival is 1st in the 7 and 4 columns, so 7 + 4 = 11."}}, {"it": {"id": "q24", "code": "24", "type": "choice", "prompt": "In Table 1, suppose the 10 Beach Party voters change only their lower choices to B > A > C. All other ballots stay the same. Who wins the top-two runoff now?", "opts": ["Carnival still wins, 21 to 12", "Carnival wins, 22 to 11", "Arcade Night wins, 22 to 11", "Beach Party wins, because its voters changed"], "key": 2, "why": "The top two are still A and C. The 10 ballots now rank A above C: A = 12 + 10 = 22, C = 11."}}, {"it": {"id": "q25", "code": "25", "type": "choice", "prompt": "A 30-voter approval election: 10 voters approve J and K · 9 approve K only · 7 approve J and L · 4 approve L only. K is currently the winner. The 10-voter group’s favorite is J, so they approve only J (bullet voting). All other ballots stay the same. What happens?", "opts": ["K still wins with 19 approvals", "J wins with 17 approvals, and K drops to 9", "J wins with 27 approvals", "J and K tie with 17 approvals each"], "key": 1, "why": "Before: J 17, K 19, L 11. After: J 17, K 9, L 11, so J wins."}}, {"talk": "Q23: what is the easiest mistake to make when reading a schedule, and how do you avoid it?"}, {"it": {"id": "q26", "code": "26", "type": "choice", "prompt": "In an 80-voter approval election, the totals are E 44, F 41, and G 30 (115 approvals in all). Which conclusion is best supported?", "opts": ["Only E has a majority, because only one candidate can have more than half", "No one has a majority, because 44 ÷ 115 is less than 50%", "The results are invalid because 115 is more than 80", "Both E and F were approved by a majority of voters (55% and about 51.3%)" e next whole number is 38.": "La mitad de 75 es 37.5; el siguiente número entero es 38.", "In a top-two runoff, which candidates advance to the final round?": "En una segunda vuelta entre los dos primeros, ¿qué candidatos pasan a la ronda final?", "The two candidates with the fewest last-place votes": "Los dos candidatos con menos votos de último lugar", "The two candidates with the highest Borda totals": "Los dos candidatos con los totales de Borda más altos", "Every candidate who earned at least one vote": "Todos los candidatos que obtuvieron al menos un voto", "The two candidates with the most first-place votes": "Los dos candidatos con más votos de primer lugar", "Only the top two by first-place votes advance.": "Solo pasan los dos primeros según los votos de primer lugar.", "Give a partner a 3-candidate example where someone wins a plurality but not a majority.": "Dale a un compañero un ejemplo con 3 candidatos en el que alguien gane por pluralidad pero no por mayoría absoluta.", "In a Borda count with 3 candidates (3-2-1), how many points does a last-place ranking earn?": "En un conteo de Borda con 3 candidatos (3-2-1), ¿cuántos puntos recibe un último lugar?", "0": "0", "2": "2", "1": "1", "3": "3", "3 candidates: 1st = 3, 2nd = 2, 3rd = 1.": "3 candidatos: 1.º = 3, 2.º = 2, 3.º = 1.", "In approval voting, may one voter approve more than one candidate?": "En la votación por aprobación, ¿puede un votante aprobar a más de un candidato?", "Yes — a voter may approve every candidate they find acceptable": "Sí: un votante puede aprobar a todos los candidatos que considere aceptables", "No — each voter approves exactly one candidate": "No: cada votante aprueba exactamente a un candidato", "Only if the voter also ranks the candidates": "Solo si el votante también ordena a los candidatos", "Only in the final round of a runoff": "Solo en la ronda final de una segunda vuelta", "Approval ballots allow several approvals.": "Las boletas de aprobación permiten varias aprobaciones.", "When does a sequential runoff stop?": "¿Cuándo se detiene una segunda vuelta secuencial?", "After exactly two rounds": "Después de exactamente dos rondas", "When one candidate has a plurality": "Cuando un candidato tiene pluralidad", "When the last-place candidate has zero votes": "Cuando el candidato en último lugar tiene cero votos", "When one candidate has a majority of the remaining votes": "Cuando un candidato tiene mayoría absoluta de los votos restantes", "Keep eliminating until someone has more than half.": "Se sigue eliminando hasta que alguien tenga más de la mitad.", "which candidate came in second place overall": "qué candidato quedó en segundo lugar en total", "which candidate each group of voters ranked second": "qué candidato puso en segundo lugar cada grupo de votantes", "how many voters chose each candidate second": "cuántos votantes eligieron a cada candidato en segundo lugar", "the runner-up in the top-two runoff": "el segundo lugar de la segunda vuelta entre los dos primeros", "Read down each column; the 2nd row is that group’s 2nd choice.": "Lee hacia abajo cada columna; la 2.ª fila es la 2.ª opción de ese grupo.", "In a preference schedule, the row labeled “2nd choice” shows ___.": "En una tabla de preferencias, la fila llamada “2.ª opción” muestra ___.", "In a 3-candidate Borda count (3-2-1) with 20 voters, what must all the candidates’ totals add up to?": "En un conteo de Borda con 3 candidatos (3-2-1) y 20 votantes, ¿cuánto deben sumar los totales de todos los candidatos?", "120": "120", "60": "60", "20": "20", "80": "80", "Each ballot gives 3 + 2 + 1 = 6 points; 20 × 6 = 120.": "Cada boleta da 3 + 2 + 1 = 6 puntos; 20 × 6 = 120.", "Sort the methods: which use only first choices, which use every ranking, and which use no ranking at all?": "Clasifica los métodos: ¿cuáles usan solo las primeras opciones, cuáles usan todo el orden y cuáles no usan ningún orden?", "exactly half of the votes": "exactamente la mitad de los votos", "a plurality": "una pluralidad", "the most last-place votes": "la mayor cantidad de votos de último lugar", "the lowest Borda total": "el total de Borda más bajo", "More than half beats everyone else combined, so it is also the most.": "Más de la mitad supera a todos los demás juntos, así que también es la mayor cantidad.", "A candidate who wins a majority of the votes must also have ___.": "Un candidato que gana por mayoría absoluta de los votos también debe tener ___.", "Which of these methods does not use ranked ballots? Sort each method.": "¿Cuál de estos métodos no usa boletas ordenadas? Clasifica cada método.", "Uses ranked ballots": "Usa boletas ordenadas", "Does not use ranked ballots": "No usa boletas ordenadas", "Approval voting uses yes/no approvals, not rankings.": "La votación por aprobación usa aprobaciones de sí o no, no un orden.", "Approval voting": "Votación por aprobación", "Using Table 1, how many students voted in all?": "Usando la tabla 1, ¿cuántos estudiantes votaron en total?", "33": "33", "4": "4", "29": "29", "12": "12", "12 + 10 + 7 + 4 = 33.": "12 + 10 + 7 + 4 = 33.", "Students who voted in all": "Estudiantes que votaron en total", "Using Table 1, how many first-place votes does Carnival (C) have?": "Usando la tabla 1, ¿cuántos votos de primer lugar tiene Carnival (C)?", "7": "7", "17": "17", "11": "11", "C is 1st in the 7 and 4 columns: 7 + 4 = 11.": "C está en 1.er lugar en las columnas de 7 y 4: 7 + 4 = 11.", "Carnival’s first-place votes": "Votos de primer lugar de Carnival", "Using Table 1, which statement correctly describes the plurality result?": "Usando la tabla 1, ¿qué afirmación describe correctamente el resultado por pluralidad?", "Arcade Night wins with 12 of 33 (36.4%), but has no majority": "Arcade Night gana con 12 de 33 (36.4 %), pero no tiene mayoría absoluta", "Arcade Night wins with a majority of 12 votes": "Arcade Night gana con una mayoría absoluta de 12 votos", "Carnival wins because it appears first in two columns": "Carnival gana porque aparece primero en dos columnas", "Beach Party wins because it is 2nd in two columns": "Beach Party gana porque está en 2.º lugar en dos columnas", "1st place: A 12, C 11, B 10. A majority of 33 is 17; 12 < 17.": "Primer lugar: A 12, C 11, B 10. La mayoría absoluta de 33 es 17; 12 < 17.", "Before counting, predict the winner of Table 1. Did the counting rule change your prediction?": "Antes de contar, predice el ganador de la tabla 1. ¿La regla de conteo cambió tu predicción?", "Using Table 1, Arcade Night and Carnival advance to a top-two runoff. What is the result?": "Usando la tabla 1, Arcade Night y Carnival pasan a una segunda vuelta entre los dos primeros. ¿Cuál es el resultado?", "Arcade Night wins, 12 to 11": "Gana Arcade Night, 12 a 11", "Arcade Night wins, 22 to 11": "Gana Arcade Night, 22 a 11", "Carnival wins, 21 to 12": "Gana Carnival, 21 a 12", "Carnival wins, 17 to 16": "Gana Carnival, 17 a 16", "The 10 Beach Party ballots rank C above A: C = 11 + 10 = 21, A = 12.": "Las 10 boletas de Beach Party ponen a C por encima de A: C = 11 + 10 = 21, A = 12.", "Using Table 1, how many students ranked Arcade Night last, and what percent is that?": "Usando la tabla 1, ¿cuántos estudiantes pusieron a Arcade Night en último lugar y qué porcentaje es?", "17 students, about 51.5%": "17 estudiantes, aproximadamente 51.5 %", "12 students, about 36.4%": "12 estudiantes, aproximadamente 36.4 %", "10 students, about 30.3%": "10 estudiantes, aproximadamente 30.3 %", "21 students, about 63.6%": "21 estudiantes, aproximadamente 63.6 %", "A is 3rd in the 10 and 7 columns: 17; 17 ÷ 33 ≈ 51.5%.": "A está en 3.er lugar en las columnas de 10 y 7: 17; 17 ÷ 33 ≈ 51.5 %.", "Using Table 1 and a Borda count (3-2-1), what is Beach Party’s total?": "Usando la tabla 1 y un conteo de Borda (3-2-1), ¿cuál es el total de Beach Party?", "61": "61", "65": "65", "30": "30", "72": "72", "B: 10(3) + 12(2) + 7(2) + 4(1) = 30 + 24 + 14 + 4 = 72. (A 61, C 65; the sum 198 = 33 × 6.)": "B: 10(3) + 12(2) + 7(2) + 4(1) = 30 + 24 + 14 + 4 = 72. (A 61, C 65; la suma 198 = 33 × 6.)", "Using Table 2, who wins by approval voting, and what percent of voters approve that candidate?": "Usando la tabla 2, ¿quién gana por votación por aprobación y qué porcentaje de votantes aprueba a ese candidato?", "X, with 18 approvals (50%)": "X, con 18 aprobaciones (50 %)", "Y, with 20 approvals (about 55.6%)": "Y, con 20 aprobaciones (aproximadamente 55.6 %)", "Z, with 18 approvals (50%)": "Z, con 18 aprobaciones (50 %)", "Y, with 2 approvals (about 5.6%)": "Y, con 2 aprobaciones (aproximadamente 5.6 %)", "X = 12 + 6 = 18; Y = 12 + 8 = 20; Z = 10 + 8 = 18. 20 ÷ 36 ≈ 55.6%.": "X = 12 + 6 = 18; Y = 12 + 8 = 20; Z = 10 + 8 = 18. 20 ÷ 36 ≈ 55.6 %.", "In a 50-voter sequential runoff, Round 1 is A 18, B 14, C 11, D 7. D is eliminated: 6 of D’s voters rank B next and 1 ranks C next. What happens?": "En una segunda vuelta secuencial con 50 votantes, la ronda 1 es A 18, B 14, C 11, D 7. Se elimina D: 6 de los votantes de D ponen a B después y 1 pone a C después. ¿Qué sucede?", "A 25, B 14, C 11; A wins with a majority": "A 25, B 14, C 11; A gana con mayoría absoluta", "A 18, B 20, C 12; B wins because B has the most votes": "A 18, B 20, C 12; B gana porque tiene más votos", "A 18, B 20, C 12; no majority yet, so C is eliminated next": "A 18, B 20, C 12; todavía no hay mayoría absoluta, así que se elimina C", "A 18, B 14, C 18; B is eliminated next": "A 18, B 14, C 18; se elimina B", "B = 14 + 6 = 20, C = 11 + 1 = 12. A majority of 50 is 26; no one has it, so drop C.": "B = 14 + 6 = 20, C = 11 + 1 = 12. La mayoría absoluta de 50 es 26; nadie la tiene, así que se elimina C.", "In Table 2, why do the approval totals add up to more than the 36 voters?": "En la tabla 2, ¿por qué los totales de aprobación suman más que los 36 votantes?", "In a 60-voter election, a candidate receives 27 first-place votes. Which statement is true? Match & Fix: the statement below has one error. Click the error, then drag in the fix.": "En una elección con 60 votantes, un candidato recibe 27 votos de primer lugar. ¿Qué afirmación es verdadera? Relaciona y corrige: la afirmación de abajo tiene un error. Haz clic en el error y luego arrastra la corrección.", "27 is ": "27 es el ", "45%": "45 %", " of the votes, so the candidate ": " de los votos, así que el candidato ", "has": "tiene", " a majority.": " mayoría absoluta.", "does not have": "no tiene", "55%": "55 %", "27%": "27 %", "has more than": "tiene más que", "27 ÷ 60 = 45%; a majority of 60 needs 31.": "27 ÷ 60 = 45 %; la mayoría absoluta de 60 necesita 31.", "In Table 1, Beach Party has the fewest first-place votes but wins the Borda count. Which fact best explains this?": "En la tabla 1, Beach Party tiene la menor cantidad de votos de primer lugar, pero gana el conteo de Borda. ¿Qué dato lo explica mejor?", "Borda gives bonus points to the candidate with the fewest first-place votes": "Borda da puntos extra al candidato con menos votos de primer lugar", "Beach Party has a majority of first-place votes": "Beach Party tiene mayoría absoluta de votos de primer lugar", "29 of 33 rank Beach Party 1st or 2nd, so it earns points on almost every ballot": "29 de 33 ponen a Beach Party en 1.º o 2.º lugar, así que recibe puntos en casi todas las boletas", "The Borda count only counts second-place votes": "El conteo de Borda solo cuenta los votos de segundo lugar", "B is 1st or 2nd in the 12, 10 and 7 columns: 29 voters, which is broad support.": "B está en 1.º o 2.º lugar en las columnas de 12, 10 y 7: 29 votantes, un apoyo amplio.", "Kim says, “In Table 1, Carnival has 7 first-place votes because the Carnival column says 7.” Which response best evaluates Kim’s reasoning? Match & Fix: click the error in Kim’s statement, then drag in the fix.": "Kim dice: “En la tabla 1, Carnival tiene 7 votos de primer lugar porque la columna de Carnival dice 7.” ¿Qué respuesta evalúa mejor el razonamiento de Kim? Relaciona y corrige: haz clic en el error de la afirmación de Kim y luego arrastra la corrección.", "In Table 1, ": "En la tabla 1, ", "Carnival": "Carnival", " has ": " tiene ", " first-place votes because the Carnival column says 7.": " votos de primer lugar porque la columna de Carnival dice 7.", "11 (7 + 4)": "11 (7 + 4)", "Beach Party": "Beach Party", "Add every column where the candidate is ranked 1st: Carnival is 1st in the 7 and 4 columns, so 7 + 4 = 11.": "Suma cada columna donde el candidato está en 1.er lugar: Carnival está primero en las columnas de 7 y 4, así que 7 + 4 = 11.", "In Table 1, suppose the 10 Beach Party voters change only their lower choices to B > A > C. All other ballots stay the same. Who wins the top-two runoff now?": "En la tabla 1, supón que los 10 votantes de Beach Party cambian solo sus opciones inferiores a B > A > C. Las demás boletas no cambian. ¿Quién gana ahora la segunda vuelta entre los dos primeros?", "Carnival still wins, 21 to 12": "Carnival sigue ganando, 21 a 12", "Carnival wins, 22 to 11": "Gana Carnival, 22 a 11", "Beach Party wins, because its voters changed": "Gana Beach Party, porque sus votantes cambiaron", "The top two are still A and C. The 10 ballots now rank A above C: A = 12 + 10 = 22, C = 11.": "Los dos primeros siguen siendo A y C. Las 10 boletas ahora ponen a A por encima de C: A = 12 + 10 = 22, C = 11.", "A 30-voter approval election: 10 voters approve J and K · 9 approve K only · 7 approve J and L · 4 approve L only. K is currently the winner. The 10-voter group’s favorite is J, so they approve only J (bullet voting). All other ballots stay the same. What happens?": "Una elección por aprobación con 30 votantes: 10 votantes aprueban a J y K · 9 aprueban solo a K · 7 aprueban a J y L · 4 aprueban solo a L. Ahora gana K. El favorito del grupo de 10 votantes es J, así que aprueban solo a J (voto único). Las demás boletas no cambian. ¿Qué sucede?", "K still wins with 19 approvals": "K sigue ganando con 19 aprobaciones", "J wins with 17 approvals, and K drops to 9": "J gana con 17 aprobaciones y K baja a 9", "J wins with 27 approvals": "J gana con 27 aprobaciones", "J and K tie with 17 approvals each": "J y K empatan con 17 aprobaciones cada uno", "Before: J 17, K 19, L 11. After: J 17, K 9, L 11, so J wins.": "Antes: J 17, K 19, L 11. Después: J 17, K 9, L 11, así que gana J.", "Q23: what is the easiest mistake to make when reading a schedule, and how do you avoid it?": "P23: ¿cuál es el error más fácil de cometer al leer una tabla y cómo lo evitas?", "In an 80-voter approval election, the totals are E 44, F 41, and G 30 (115 approvals in all). Which conclusion is best supported?": "En una elección por aprobación con 80 votantes, los totales son E 44, F 41 y G 30 (115 aprobaciones en total). ¿Qué conclusión está mejor apoyada?", "Only E has a majority, because only one candidate can have more than half": "Solo E tiene mayoría absoluta, porque solo un candidato puede tener más de la mitad", "No one has a majority, because 44 ÷ 115 is less than 50%": "Nadie tiene mayoría absoluta, porque 44 ÷ 115 es menos del 50 %", "The results are invalid because 115 is more than 80": "Los resultados no son válidos porque 115 es más que 80", "Both E and F were approved by a majority of voters (55% and about 51.3%)": "Tanto E como F fueron aprobados por la mayoría absoluta de los votantes (55 % y aproximadamente 51.3 %)", "Use the number of voters: 44 ÷ 80 = 55%, 41 ÷ 80 ≈ 51.3%.": "Usa el número de votantes: 44 ÷ 80 = 55 %, 41 ÷ 80 ≈ 51.3 %.", "A headline reads: “Patel wins with majority support.” The results were Patel 515, Nguyen 300, Ortiz 185. Is the headline supported?": "Un titular dice: “Patel gana con apoyo mayoritario.” Los resultados fueron Patel 515, Nguyen 300, Ortiz 185. ¿Los datos apoyan el titular?", "No: Patel needs 1,000 votes for a majority": "No: Patel necesita 1,000 votos para la mayoría absoluta", "No: Nguyen and Ortiz together have 485, so it is a tie": "No: Nguyen y Ortiz juntos ti da": "Solo Borda", "No method": "Ningún método", "Only plurality": "Solo la pluralidad", "A majority of 1st-place votes wins plurality and Round 1 of both runoffs; Borda can still choose someone else.": "Una mayoría absoluta de votos de primer lugar gana la pluralidad y la ronda 1 de ambas segundas vueltas; Borda todavía puede elegir a otro.", "A 30-voter approval election also asked for one favorite. H: 14 approvals, 12 favorites · I: 25 approvals, 8 favorites · J: 17 approvals, 10 favorites. Which conclusion is best supported?": "Una elección por aprobación con 30 votantes también pidió un favorito. H: 14 aprobaciones, 12 favoritos · I: 25 aprobaciones, 8 favoritos · J: 17 aprobaciones, 10 favoritos. ¿Qué conclusión está mejor apoyada?", "H should win because H has the most favorites and approvals combined": "H debería ganar porque tiene más favoritos y aprobaciones combinados", "I wins by approval with 25 of 30 (about 83.3%), even though I has the fewest favorites": "I gana por aprobación con 25 de 30 (aproximadamente 83.3 %), aunque I tiene menos favoritos", "J wins because J is in the middle on both counts": "J gana porque está en medio en ambos conteos", "No one wins because the favorites add up to 30": "Nadie gana porque los favoritos suman 30", "Approval counts acceptability: I = 25 of 30 ≈ 83.3%.": "La aprobación mide qué tan aceptable es: I = 25 de 30 ≈ 83.3 %.", "Q29: which methods always respect a majority winner? Why might Borda not?": "P29: ¿qué métodos siempre respetan a un ganador por mayoría absoluta? ¿Por qué Borda podría no hacerlo?", "In Table 3, Pizza Party has the most first-place votes. Which fact best shows it is a weak choice?": "En la tabla 3, Pizza Party tiene más votos de primer lugar. ¿Qué dato muestra mejor que es una opción débil?", "Pizza Party has 15 first-place votes": "Pizza Party tiene 15 votos de primer lugar", "Quiz Bowl has 11 first-place votes": "Quiz Bowl tiene 11 votos de primer lugar", "Scavenger Hunt has only 5 first-place
